name: CI

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Le sitemap est généré par Eleventy et un test le lit dans _site/.
      - run: npm run build

      - run: npm test

      # Build comme le site en ligne (Netlify CONTEXT=production) : les planches sont exclues,
      # et une page qui casse ce mode bloquerait la mise en ligne sans que la preview le montre.
      - run: rm -rf _site && npm run build && test -f _site/index.html && test -f _site/tours/4-islands/index.html && test ! -e _site/_components && test ! -e _site/design
        env:
          CONTEXT: production
