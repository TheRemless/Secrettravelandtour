[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Mise en ligne avec 2 photos temporaires (haut de la 4 Islands, ponton de Lanta Old Town), créditées sur /credits/.
# Accord de Jérémy du 11.11.2026. À retirer quand les vraies photos sont là.
[context.production.environment]
  STT_ALLOW_PLACEHOLDERS = "1"

# Cache navigateur. Les images générées dans /img/ portent un hash dans leur nom : cache d'un an.
# Les sources (/images/) gardent un nom stable : une semaine, revalidation en arrière-plan.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Trajet Krabi Airport → Khao Lak retiré le 10.11.2026 (Jérémy) : l'ancienne adresse mène au hub taxi.
[[redirects]]
  from = "/taxi/krabi-airport-khao-lak/"
  to = "/taxi/"
  status = 301
  force = true

[[redirects]]
  from = "/taxi/krabi-airport-khao-lak"
  to = "/taxi/"
  status = 301
  force = true

# Versions françaises des pages légales retirées le 02.11.2026 (site en anglais seulement pour l'instant).
[[redirects]]
  from = "/terms/fr/*"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/legal/fr/*"
  to = "/legal/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/fr/*"
  to = "/privacy/"
  status = 301
  force = true

# Koh Talabeng & Koh Bubu fondue dans Kayaking le 10.11.2026 (les trois sorties y étaient déjà, mêmes prix).
[[redirects]]
  from = "/tours/koh-talabeng-koh-bubu/*"
  to = "/tours/kayak/"
  status = 301
  force = true

# Snorkeling remis dans la fiche plongée le 12.11.2026 (la page à part était en ligne depuis le 11.11.2026).
[[redirects]]
  from = "/tours/snorkelling/*"
  to = "/tours/scuba-diving/"
  status = 301
  force = true
