[build]
  command = "npm run build"
  publish = "_site"

# Cache navigateur. Les images générées dans /img/ portent un hash dans leur nom : cache d'un an.
# Les sources (/images/) gardent un nom stable : une semaine, revalidation en arrière-plan.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Les pages légales n'existent qu'en anglais. Les anciennes adresses /fr/ (en ligne le 02.11.2026) renvoient vers l'anglais.
[[redirects]]
  from = "/terms/fr/"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/legal/fr/"
  to = "/legal/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/fr/"
  to = "/privacy/"
  status = 301
  force = true
