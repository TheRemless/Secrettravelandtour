[build]
  command = "npm run build"
  publish = "_site"
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

# IndexNow : après chaque déploi de production publié (onSuccess), envoie à Bing, Yandex, Seznam et Naver
# les pages du sitemap nouvelles, modifiées ou supprimées. Jamais depuis un aperçu, une branche ou un build local.
[[plugins]]
  package = "./netlify/plugins/indexnow"

# Cache navigateur. Les images générées dans /img/ portent un hash dans leur nom : cache d'un an.
# Les sources (/images/) gardent un nom stable : une semaine, revalidation en arrière-plan.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/css/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fichiers pour les assistants IA (llmstxt.org) : texte UTF-8 (tirets des horaires, « & »), relus au plus après une heure.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# IndexNow (17.11.2026) : le manifeste sert au plugin (comparaison avec le déploi suivant), pas aux lecteurs.
[[headers]]
  for = "/indexnow-manifest.json"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cc698212e79400cca1a404ad4bf10b5f.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

# Trajet Krabi Airport → Khao Lak retiré le 10.11.2026 (Jérémy) : l'ancienne adresse mène au hub taxi.
[[redirects]]
  from = "/taxi/krabi-airport-khao-lak/"
  to = "/taxi/"
  status = 301
  force = true

[[redirects]]
  from = "/taxi/krabi-airport-khao-lak"
  to = "/taxi/"
  status = 301
  force = true

# Versions françaises des pages légales retirées le 02.11.2026 (site en anglais seulement pour l'instant).
[[redirects]]
  from = "/terms/fr/*"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/legal/fr/*"
  to = "/legal/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy/fr/*"
  to = "/privacy/"
  status = 301
  force = true

# Koh Talabeng & Koh Bubu fondue dans Kayaking le 10.11.2026 (les trois sorties y étaient déjà, mêmes prix).
[[redirects]]
  from = "/tours/koh-talabeng-koh-bubu/*"
  to = "/tours/kayak/"
  status = 301
  force = true

# Snorkeling remis dans la fiche plongée le 12.11.2026 (la page à part était en ligne depuis le 11.11.2026).
[[redirects]]
  from = "/tours/snorkelling/*"
  to = "/tours/scuba-diving/"
  status = 301
  force = true
